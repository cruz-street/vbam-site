name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # Every PR against main gets its own preview deploy (link posted on the PR).
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: cd app && pnpm install --frozen-lockfile

      # Single build — Next.js static export consumes the env vars below at build time.
      # Same artifact is then deployed to the Pages projects below.
      - name: Build
        run: cd app && pnpm build
        env:
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}

      # PRODUCTION — push to `main` deploys to vbam-site-prod (Jesse's CF account)
      # which is wired to the custom domain verobeachadultmedicine.com.
      # LIVE deploy gate: pushes to main are gated by the branch ruleset (Jesse
      # code-owner approval), so every merge requires Jesse;
      # manual dispatch on main is restricted to Jesse. Decap CMS + team edits
      # arrive as PRs to main; nothing publishes without that approval. Every PR gets a preview deploy below.
      - name: Deploy to production (verobeachadultmedicine.com)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.actor == 'jessepc')
        run: npx wrangler@latest pages deploy app/out --project-name=vbam-site-prod --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PROD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PROD }}

      # DEV URL — push to `main` also deploys the same build to the
      # verobeachadultmedicine Pages project (Jesse's CF tenant, production_branch=main),
      # which serves verobeachadultmedicine.pages.dev. The `staging` branch is retired.
      # The old vbam-site project on Ashwin's account is abandoned in place —
      # do not deploy to it.
      - name: Deploy to dev URL (verobeachadultmedicine.pages.dev)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npx wrangler@latest pages deploy app/out --project-name=verobeachadultmedicine --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 037aff9f2c67ac6312058b641540ebd5

      # PREVIEW — every PR into `main` deploys to the verobeachadultmedicine
      # project under its own branch alias (not production), then posts or
      # updates one comment with the link. Same-repo PRs only: fork PRs do not
      # get secrets. Nothing here touches production.
      - name: Deploy PR preview
        id: preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 037aff9f2c67ac6312058b641540ebd5
          command: pages deploy app/out --project-name=verobeachadultmedicine --branch=${{ github.head_ref }}

      - name: Comment preview link on PR
        if: steps.preview.outputs.deployment-url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- pr-preview -->';
            const body = `${marker}\n**Preview:** ${process.env.PREVIEW_URL}\n\nUpdated for ${context.payload.pull_request.head.sha.slice(0, 7)}. Not live; nothing is published until Jesse merges.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
